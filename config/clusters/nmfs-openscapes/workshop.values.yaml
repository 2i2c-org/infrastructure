nfs:
  pv:
    serverIP: 10.100.19.201

jupyterhub:
  custom:
    homepage:
      # Remove once https://github.com/2i2c-org/default-hub-homepage/pull/51
      # is merged
      gitRepoBranch: unify-logins-2
    singleuserAdmin:
      extraVolumeMounts:
        01-allusers-volumemount:
        02-allusers-rstudio-volumemount:
  hub:
    allowNamedServers: true
    config:
      JupyterHub:
        authenticator_class: shared-password
      Authenticator:
        manage_groups: false
        enable_auth_state: false
        allow_all: true
        admin_users:
        - ateucher   # Andy Teucher
        - jules32   # Julia Stewart Lowndes
        - eeholmes   # Eli Holmes
        - camante # Christopher.Amante@colorado.edu
        # https://2i2c.freshdesk.com/a/tickets/5970
        - mfisher87
        - e1im
        - mmacferrin
        - matth-love
        - georgianaelena
  singleuser:
    storage:
      extraVolumes:
        01-scratch-session:
          name: scratch-session
          emptyDir:
            # Limit total size, to prevent pod being evicted
            # with over use by any one user. This can be increased,
            # but may need to increase the size of the node disk
            sizeLimit: 15Gi
      extraVolumeMounts:
        01-scratch-session:
          name: scratch-session
          mountPath: /tmp
        1-shared-public-volumemount:
          name: home
          mountPath: /home/jovyan/shared-public
          subPath: _shared-public
          readOnly: false
    defaultUrl: /lab
    extraEnv:
      SCRATCH_BUCKET: s3://nmfs-openscapes-scratch-workshop/$(JUPYTERHUB_USER)
      PERSISTENT_BUCKET: s3://nmfs-openscapes-persistent-workshop/$(JUPYTERHUB_USER)
      GH_SCOPED_CREDS_CLIENT_ID: Iv23liopQ2cWF2zW212t
      GH_SCOPED_CREDS_APP_URL: https://github.com/apps/nmfs-openscapes-workshop-github
    profileList:
    - display_name: Default
      description: Choose image and resource allocation
      default: true
      profile_options:
        image:
          display_name: Image
          dynamic_image_building:
            enabled: true
          choices:
            cudem-jupyter:
              display_name: Workshop Coastal Coupling 2026
              slug: coastalcoupling
              default: true
              kubespawner_override:
                image: ghcr.io/continuous-dems/cudem-jupyter:workshop-coastal-coupling-2026
                image_pull_policy: Always
          unlisted_choice:
            enabled: true
            display_name: Custom image
            validation_regex: ^.+:.+$
            validation_message: Must be a publicly available docker image, of form <image-name>:<tag>
            kubespawner_override:
              image: '{value}'
              image_pull_policy: Always
        requests:
          display_name: Resource Allocation
          choices:
            mem_7_gb:
              display_name: ~7 GB RAM, ~0.9 CPUs
              description: Up to ~4 CPUs when available
              kubespawner_override:
                mem_guarantee: 7805679519
                mem_limit: 7805679519
                cpu_guarantee: 0.912625
                cpu_limit: 3.6505
                node_selector:
                  node.kubernetes.io/instance-type: r5.xlarge
jupyterhub-home-nfs:
  eks:
    volumeId: vol-07154b7def3b80b96

binderhub-service:
  enabled: false
