apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: nodepoolallocationtargets.jupyter.org
spec:
  scope: Cluster
  group: jupyter.org
  names:
    kind: NodepoolAllocationTarget
    plural: nodepoolallocationtargets
    singular: nodepoolallocationtarget
    shortNames:
      - npats
      - npat
  versions:
    - name: v1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              x-kubernetes-preserve-unknown-fields: true
            status:
              type: object
              x-kubernetes-preserve-unknown-fields: true
      additionalPrinterColumns:
      - name: State
        type: string
        description: Nodepool allocation target state
        jsonPath: .status.state
      - name: Node count
        type: integer
        description: Current Kubernetes node count
        jsonPath: .status.current_node_count
      - name: Nodepool
        type: string
        description: Nodepool name
        jsonPath: .status.nodepool_allocation.name
      - name: Target Min node count
        type: integer
        description: Target minimum node count
        jsonPath: .status.nodepool_allocation.target_min_node_count
      - name: Min node count
        type: integer
        description: Minimum node count
        jsonPath: .status.nodepool_allocation.min_node_count
      - name: Max node count
        type: integer
        description: Maximum node count
        jsonPath: .status.nodepool_allocation.max_node_count
      - name: Age
        type: date
        jsonPath: .metadata.creationTimestamp