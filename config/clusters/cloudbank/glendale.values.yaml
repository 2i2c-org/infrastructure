jupyterhub:
  custom:
    2i2c:
      add_staff_user_ids_to_admin_users: true
      add_staff_user_ids_of_type: google
    homepage:
      templateVars:
        org:
          name: Glendale Community College
          logo_url: https://www.glendale.edu/home/showpublishedimage/33622/637538639301600000
          url: https://www.glendale.edu/
        designed_by:
          name: 2i2c
          url: https://2i2c.org
        operated_by:
          name: CloudBank
          url: http://cloudbank.org/
        funded_by:
          name: CloudBank
          url: http://cloudbank.org/
  hub:
    image:
      name: quay.io/2i2c/oauthenticator-latest
      tag: "0.0.1-0.dev.git.16543.h8ea1d8b9f"
    config:
      JupyterHub:
        authenticator_class: google
      GoogleOAuthenticator:
        username_claim: email
        hosted_domain:
        - glendale.edu
        - student.glendale.edu
        strip_domain: false
        allow_all: true
      Authenticator:
        admin_users:
        - simon@glendale.edu
        - ericvd@berkeley.edu
        - sean.smorris@berkeley.edu
jupyterhub-home-nfs:
  gke:
    volumeId: projects/cb-1003-1696/zones/us-central1-b/disks/hub-nfs-homedirs-glendale
