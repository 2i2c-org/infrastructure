jupyterhub:
  custom:
    2i2c:
      add_staff_user_ids_to_admin_users: true
      add_staff_user_ids_of_type: google
    homepage:
      templateVars:
        org:
          name: El Camino College
          logo_url: https://www.elcamino.edu/_resources/images/logo.png
          url: https://www.elcamino.edu/
        designed_by:
          name: 2i2c
          url: https://2i2c.org
        operated_by:
          name: CloudBank
          url: http://cloudbank.org/
        funded_by:
          name: CloudBank
          url: http://cloudbank.org/

  singleuser:
    memory:
      limit: 3G
      guarantee: 3G
  hub:
    image:
      name: quay.io/2i2c/oauthenticator-latest
      tag: 0.0.1-0.dev.git.17203.h34102b8b4
    config:
      JupyterHub:
        authenticator_class: google
      GoogleOAuthenticator:
        username_claim: email
        allowed_hosted_domains:
        - elcamino.edu
        strip_domain: false
        # allowed_hosted_domains is additive and honours admin_users,
        # so allow_all is not needed. allow_existing_users grandfathers
        # the off-domain accounts already in this hub's database.
        allow_all: false
        allow_existing_users: true
      Authenticator:
        admin_users:
        - ericvd@berkeley.edu
        - sean.smorris@berkeley.edu
        - srussell@elcamino.edu
        - ammartinez@elcamino.edu
        - jacobquisumbing@berkeley.edu
        - jedwin321@berkeley.edu
        - jonathanferrari@berkeley.edu
        - arianaghimire27@berkeley.edu
        - bdsomer@berkeley.edu
        - brandon_concepcion@berkeley.edu
        - jegeronimo@berkeley.edu
        - mark.barranda@berkeley.edu
        - skompalli@berkeley.edu
        - waylandla@berkeley.edu
        - johnll2@berkeley.edu
        - szuh@berkeley.edu
jupyterhub-home-nfs:
  gke:
    volumeId: projects/cb-1003-1696/zones/us-central1-b/disks/hub-nfs-homedirs-elcamino
  quotaEnforcer:
    resources:
      requests:
        cpu: 0.2
        memory: 1G
      limits:
        cpu: 0.4
        memory: 1.2G
