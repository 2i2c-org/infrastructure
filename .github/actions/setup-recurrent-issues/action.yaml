name: Setup an action for creating recurrent issues

inputs:
  label:
    required: true
    default: ''
  title:
    required: true
  body:
    required: true
  assignee:
    default: ''
  parent:
    default: ''
  blocked_by:
    default: ''
  fields:
    required: true
  values:
    required: true
  GH_TOKEN:
    required: true
  project_board_url:
    required: true
    default: https://github.com/orgs/2i2c-org/projects/57
outputs:
  issue_number:
    value: ${{ steps.create-issue.outputs.issue_number }}
runs:
  using: composite
  steps:
  - name: Create issue
    id: create-issue
    run: |
      issue=$(gh issue create \
      --label "recurrent" \
      --label "${{ inputs.label }}" \
      --assignee "${{ inputs.assignee }}" \
      --title "${{ inputs.title }}" \
      --body "${{ inputs.body }}" \
      --parent "${{ inputs.parent }}" \
      --blocked-by "${{ inputs.blocked_by }}")
      echo "issue=$issue" >> $GITHUB_ENV
      echo "issue_number=$(echo $issue)" >> $GITHUB_OUTPUT
    env:
      GH_TOKEN: ${{ inputs.GH_TOKEN }}
      GH_REPO: ${{ github.repository }}
    shell: bash

  - name: Sleep a bit to allow issue to be added to the board by automation
    run: sleep 3
    shell: bash

  - name: Set the "Status" and "Estimate" project board fields
    uses: EndBug/project-fields@v2
    id: set-fields
    with:
      operation: set
          # If the fields name or type will change
          # expect this step to fail
      fields: ${{ inputs.fields }}
      github_token: ${{ inputs.GH_TOKEN }}
      project_url: ${{ inputs.project_board_url }}
      values: ${{ inputs.values }}
      resource_url: ${{ env.issue }}
