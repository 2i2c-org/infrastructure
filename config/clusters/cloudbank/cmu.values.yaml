jupyterhub:
  scheduling:
    userScheduler:
      enabled: true
  custom:
    2i2c:
      add_staff_user_ids_of_type: google
      add_staff_user_ids_to_admin_users: true
    homepage:
      templateVars:
        designed_by:
          name: 2i2c
          url: https://2i2c.org
        funded_by:
          name: CloudBank
          url: http://cloudbank.org/
        operated_by:
          name: CloudBank
          url: http://cloudbank.org/
        org:
          logo_url: https://keystoneacademic-res.cloudinary.com/image/upload/c_pad,w_256,h_121/dpr_auto/f_auto/q_auto/v1/element/22/221143__logo.png
          name: Carnegie Mellon University
          url: https://www.cmu.edu
  hub:
    config:
      JupyterHub:
        authenticator_class: cilogon
      CILogonOAuthenticator:
        allowed_idps:
          https://login.cmu.edu/idp/shibboleth:
            default: true
            username_derivation:
              username_claim: email
            allow_all: true
          http://google.com/accounts/o8/id:
            username_derivation:
              username_claim: email
      Authenticator:
        admin_users:
        - sean.smorris@berkeley.edu
        - ericvd@berkeley.edu
        - ddeblasi@andrew.cmu.edu
        - icaoberg@andrew.cmu.edu
        - aramchal@andrew.cmu.edu
        - daphneh@andrew.cmu.edu
        - jslackma@andrew.cmu.edu
        - ray@andrew.cmu.edu
        - ray@cmu.edu
        - michaeltarr@cmu.edu

  singleuser:
    profileList:
    - display_name: CPU only
      default: true
      profile_options:
        image:
          display_name: Image
          unlisted_choice:
            enabled: true
            display_name: Custom image
            validation_regex: ^.+:.+$
            validation_message: Must be a publicly available docker image, of form <image-name>:<tag>
            kubespawner_override:
              image: '{value}'
          choices:
            00-base:
              display_name: Default Image
              description: RStudio, VS Code, JupyterLab, Python, R
              default: true
              kubespawner_override:
                image: us-central1-docker.pkg.dev/cal-icor-hubs/user-images/base-user-image:42a579e662f4
            01-slm:
              display_name: Small Language Models - Workshop hub
              description: Python typical DS plus SLM packages
              kubespawner_override:
                image: us-central1-docker.pkg.dev/cal-icor-hubs/user-images/workshop-cpu-image:0e15c5f67363
            02-scipy:
              display_name: Jupyter SciPy Notebook
              description: Scientific Python image
              slug: scipy
              kubespawner_override:
                image: quay.io/jupyter/scipy-notebook:2025-01-06
            03-pangeo:
              display_name: Pangeo Notebook Image
              description: Python image with scientific, dask and geospatial tools
              kubespawner_override:
                image: pangeo/pangeo-notebook:2025.01.24
            04-c-sharp-user-image:
              display_name: C# Image
              description: RStudio, VS Code, JupyterLab, Python, R, C#
              kubespawner_override:
                image: us-central1-docker.pkg.dev/cal-icor-hubs/user-images/c-sharp-user-image:dce2d64366ff
      kubespawner_override:
        mem_guarantee: 4G
        mem_limit: 8G
        cpu_guarantee: 0.1
        cpu_limit: 2
        node_selector:
          node.kubernetes.io/instance-type: n2-highmem-4
        default: true
    - display_name: 0.5 NVIDIA Tesla T4, ~1.5 CPU (~8 GB CPU RAM)
      description: Up to 3 CPUs when available
      profile_options:
        image:
          display_name: Image
          unlisted_choice:
            enabled: true
            display_name: Custom image
            validation_regex: ^.+:.+$
            validation_message: Must be a publicly available docker image, of form <image-name>:<tag>
            kubespawner_override:
              image: '{value}'
          choices:
            00-sml-pytorch:
              display_name: Small Models and Pangeo PyTorch ML Notebook (2026.01.30)
              slug: small_models
              kubespawner_override:
                image: us-central1-docker.pkg.dev/cal-icor-hubs/user-images/workshop-gpu-image:f40f3c6e6069
            01-tensorflow:
              display_name: Pangeo Tensorflow ML Notebook (2026.01.30)
              slug: tensorflow
              kubespawner_override:
                image: pangeo/ml-notebook:2026.01.30
            02-pytorch:
              display_name: Pangeo PyTorch ML Notebook (2026.01.30)
              slug: pytorch
              kubespawner_override:
                image: pangeo/pytorch-notebook:2026.01.30
      kubespawner_override:
        environment:
          NVIDIA_DRIVER_CAPABILITIES: compute,utility
        mem_guarantee: 12G
        mem_limit: 16G
        cpu_guarantee: 1.5
        cpu_limit: 3
        node_selector:
          node.kubernetes.io/instance-type: n1-highmem-8
        extra_resource_limits:
          nvidia.com/gpu: '1'

jupyterhub-home-nfs:
  gke:
    volumeId: projects/cb-1003-1696/zones/us-central1-b/disks/hub-nfs-homedirs-cmu
  quotaEnforcer:
    config:
      QuotaManager:
        quota_overrides:
          _shared: 400
