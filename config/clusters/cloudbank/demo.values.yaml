jupyterhub:
  prePuller:
    # hook prePuller shouldn't be enabled when configuring images in any other
    # way than singleuser.image
    hook:
      enabled: true
  singleuser:
    memory:
      guarantee: 512M
      limit: 1G
  custom:
    2i2c:
      add_staff_user_ids_to_admin_users: true
      add_staff_user_ids_of_type: github
    homepage:
      # Required by shared-password auth so the login page shows the
      # username/password form. Remove once
      # https://github.com/2i2c-org/default-hub-homepage/pull/51 is merged.
      gitRepoBranch: unify-logins-2
      templateVars:
        org:
          name: 2i2c / CloudBank Hubs Demo
          logo_url: https://www.cloudbank.org/sites/default/files/file_fields/logo.png
          url: https://docs.2i2c.org/
        designed_by:
          name: 2i2c
          url: https://2i2c.org
        operated_by:
          name: CloudBank
          url: http://cloudbank.org/
        funded_by:
          name: CloudBank
          url: http://cloudbank.org/
  hub:
    config:
      # ---------------------------------------------------------------
      # PREVIOUS AUTH SCHEME - GitHub OAuth against the ucb-ds org.
      # To restore: uncomment this block, delete the shared-password
      # block below, and remove the `gitRepoBranch` line added above.
      # Nothing else is needed - `enc-demo-git.secret.values.yaml` is
      # still listed in cluster.yaml and still holds the
      # GitHubOAuthenticator client_id/client_secret; it is simply
      # inert while authenticator_class is shared-password.
      #
      # JupyterHub:
      #   authenticator_class: github
      # GitHubOAuthenticator:
      #   allowed_organizations:
      #   - ucb-ds
      #   scope:
      #   - read:org
      # Authenticator:
      #   admin_users:
      #   - sean-morris
      #   - ericvd-ucb
      # ---------------------------------------------------------------
      JupyterHub:
        admin_access: true
        authenticator_class: shared-password
      Authenticator:
        # We don't use the per-group password feature of shared-passwords yet
        manage_groups: false
        # Allow everyone with the password to log in
        allow_all: true
        admin_users:
        - sean.smorris@berkeley.edu
        - ericvd@berkeley.edu
        # lowercase: JupyterHub normalizes typed usernames to lowercase,
        # and with shared-password the user types their own username
        - caroline.hutchings@norcocollege.edu
  cull:
    # Cull after 30min of inactivity
    every: 300
    timeout: 1800
    # No pods over 12h long
    maxAge: 43200
jupyterhub-home-nfs:
  gke:
    volumeId: projects/cb-1003-1696/zones/us-central1-b/disks/hub-nfs-homedirs-demo
