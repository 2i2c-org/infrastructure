jupyterhub:
  cull:
    every: 60
    timeout: 300
  singleuser:
    extraFiles:
      kernel-cull:
        mountPath: /etc/jupyter/jupyter_server_config.d/kernel-cull.json
        data:
          MappingKernelManager:
            cull_idle_timeout: 300
            cull_interval: 60
            cull_connected: true
            cull_busy: false
          ServerApp:
            shutdown_no_activity_timeout: 300
  scheduling:
    userScheduler:
      # I was noticing sometimes upto a minute between when
      # a new node is up and the scheduler notices with the
      # default optimizing scheduler. Let's run our own scheduler
      # which is much faster. This is anecdotal information
      enabled: true
  custom:
    2i2c:
      add_staff_user_ids_of_type: github
      add_staff_user_ids_to_admin_users: false
    homepage:
      templateVars:
        designed_by:
          name: 2i2c
          url: https://2i2c.org
        funded_by:
          name: CloudBank
          url: http://cloudbank.org/
        operated_by:
          name: CloudBank
          url: http://cloudbank.org/
        org:
          logo_url: https://www.cloudbank.org/sites/default/files/file_fields/logo.png
          name: CloudBank Classroom - GPU Demo
          url: https://www.cloudbank.org/
  hub:
    image:
      name: quay.io/2i2c/jupyterhub-6
      tag: 0.0.1-0.dev.git.16914.h6b64c8e2c
    allowNamedServers: true
    config:
      JupyterHub:
        admin_access: true
        authenticator_class: shared-password
      Authenticator:
        manage_groups: false
        # Allow everyone with the right password to log in
        allow_all: true
        admin_users:
        - yuvipanda@2i2c.org
        - sean.smorris@berkeley.edu
        - ericvd@berkeley.edu
jupyterhub-home-nfs:
  gke:
    volumeId: projects/cb-1003-1696/zones/us-central1-b/disks/hub-nfs-homedirs-gpu-demo
  quotaEnforcer:
    config:
      QuotaManager:
        hard_quota: 30 # in GiB
