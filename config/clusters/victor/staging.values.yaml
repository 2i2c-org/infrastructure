basehub:
  nfs:
    pv:
      serverIP: 10.100.237.53

  jupyterhub-home-nfs:
    eks:
      volumeId: vol-0a4147126b73d7ff9
    quotaEnforcer:
      config:
        QuotaManager:
          hard_quota: 5 # in GiB
  jupyterhub:
    custom:
      singleuserAdmin:
        extraVolumeMounts:
          # Admins can see every project folder, read-only, at ~/all-projects.
          # Merged with the default shared-readwrite mounts from basehub.
          010-projects-readonly-volumemount:
            name: home
            mountPath: /home/jovyan/all-projects
            subPath: _projects
            readOnly: true
    hub:
      extraConfig:
        001-group-shared-directories: |
          # Give members of a JupyterHub group a shared, read-write folder.
          #
          # A user in the JupyterHub group "project:<name>" gets the directory
          # _projects/<name> (on the hub's home volume) mounted read-write at
          # ~/projects/<name>. Group membership is read from the hub every time
          # a server starts, so changes apply on the next server start.
          #
          # Only groups starting with GROUP_PREFIX are considered, and each
          # <name> must be a plain directory name. The directory should
          # already exist at _projects/<name>, owned by uid 1000 / gid 100 so
          # members can write (if missing, Kubernetes creates it owned by root).
          import re

          GROUP_PREFIX = "project:"
          SAFE_NAME = re.compile(r"[A-Za-z0-9][A-Za-z0-9._-]*")

          def group_shared_directories(spawner):
              overrides = {}
              for g in spawner.user.groups:
                  if not g.name.startswith(GROUP_PREFIX):
                      continue
                  name = g.name[len(GROUP_PREFIX):]
                  if not SAFE_NAME.fullmatch(name):
                      continue
                  overrides[f"group-{g.name}"] = {
                      "groups": [g.name],
                      "spawner_override": {
                          "volume_mounts": {
                              f"group-{g.name}": {
                                  "name": "home",
                                  "mountPath": f"/home/jovyan/projects/{name}",
                                  "subPath": f"_projects/{name}",
                                  "readOnly": False,
                              }
                          }
                      },
                  }
              return overrides

          c.KubeSpawner.group_overrides = group_shared_directories
    singleuser:
      profileList:
        # IMPORTANT: Staging and prod's profileList's are meant to be kept
        #            equivalent with the exception that staging adds
        #            unlisted_choice to pick a custom image. If you update
        #            either, update the other as well.
        #
      - display_name: CPU Only
        profile_options:
          image: &profile_option_image
            display_name: Image
            choices:
              a-victor-notebook:
                display_name: Victor Notebook
                default: true
                kubespawner_override:
                  image: quay.io/volcanocyber/victor-notebook:a7c0638733cc
              b-pytorch-notebook:
                display_name: Pangeo ML Notebook (Pytorch)
                kubespawner_override:
                  image: quay.io/pangeo/pytorch-notebook:2026.04.29
              c-ml-notebook:
                display_name: Pangeo ML Notebook (Tensorflow)
                kubespawner_override:
                  image: quay.io/pangeo/ml-notebook:2026.04.29
            unlisted_choice:
              enabled: true
              display_name: Custom image
              validation_regex: ^.+:.+$
              validation_message: Must be a publicly available docker image, of form <image-name>:<tag>
              kubespawner_override:
                image: '{value}'
          resource_allocation:
            display_name: Resource Allocation
            choices:
              # r5.xlarge
              # [[[cog
              # from deployer.dev_commands.generate.resource_allocation.generate_choices import choices
              # choices(["r5.xlarge:4", "r5.4xlarge:3"], "proportional-memory-strategy", default=True)
              # ]]]
              mem_4_gb:
                display_name: ~4 GB RAM, ~0.5 CPUs
                description: Up to ~4 CPUs when available
                kubespawner_override:
                  mem_guarantee: 3902839759
                  mem_limit: 3902839759
                  cpu_guarantee: 0.4563125
                  cpu_limit: 3.6505
                  node_selector:
                    node.kubernetes.io/instance-type: r5.xlarge
                default: true
              mem_7_gb:
                display_name: ~7 GB RAM, ~0.9 CPUs
                description: Up to ~4 CPUs when available
                kubespawner_override:
                  mem_guarantee: 7805679519
                  mem_limit: 7805679519
                  cpu_guarantee: 0.912625
                  cpu_limit: 3.6505
                  node_selector:
                    node.kubernetes.io/instance-type: r5.xlarge
              mem_15_gb:
                display_name: ~15 GB RAM, ~1.8 CPUs
                description: Up to ~4 CPUs when available
                kubespawner_override:
                  mem_guarantee: 15611359038
                  mem_limit: 15611359038
                  cpu_guarantee: 1.82525
                  cpu_limit: 3.6505
                  node_selector:
                    node.kubernetes.io/instance-type: r5.xlarge
              mem_29_gb:
                display_name: ~29 GB RAM, ~4 CPUs
                description: ~4 CPUs always available
                kubespawner_override:
                  mem_guarantee: 31222718077
                  mem_limit: 31222718077
                  cpu_guarantee: 3.6505
                  cpu_limit: 3.6505
                  node_selector:
                    node.kubernetes.io/instance-type: r5.xlarge
              mem_30_gb:
                display_name: ~30 GB RAM, ~4 CPUs
                description: Up to ~15 CPUs when available
                kubespawner_override:
                  mem_guarantee: 32010353508
                  mem_limit: 32010353508
                  cpu_guarantee: 3.845275
                  cpu_limit: 15.3811
                  node_selector:
                    node.kubernetes.io/instance-type: r5.4xlarge
              mem_60_gb:
                display_name: ~60 GB RAM, ~8 CPUs
                description: Up to ~15 CPUs when available
                kubespawner_override:
                  mem_guarantee: 64020707016
                  mem_limit: 64020707016
                  cpu_guarantee: 7.69055
                  cpu_limit: 15.3811
                  node_selector:
                    node.kubernetes.io/instance-type: r5.4xlarge
              mem_119_gb:
                display_name: ~119 GB RAM, ~15 CPUs
                description: ~15 CPUs always available
                kubespawner_override:
                  mem_guarantee: 128041414033
                  mem_limit: 128041414033
                  cpu_guarantee: 15.3811
                  cpu_limit: 15.3811
                  node_selector:
                    node.kubernetes.io/instance-type: r5.4xlarge
              # [[[end]]]
      - display_name: NVIDIA Tesla T4, ~16 GB, ~4 CPUs
        description: Start a container on a dedicated node with a GPU
        slug: gpu
        kubespawner_override:
          environment:
            NVIDIA_DRIVER_CAPABILITIES: compute,utility
          mem_limit:
          mem_guarantee: 14G
          node_selector:
            node.kubernetes.io/instance-type: g4dn.xlarge
          extra_resource_limits:
            nvidia.com/gpu: '1'
        profile_options:
          image: *profile_option_image
