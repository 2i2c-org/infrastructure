nfs:
  pv:
    serverIP: 10.100.56.44
jupyterhub:
  custom:
    maap:
      apiBaseUrl: https://api.maap-project.org
    2i2c:
      add_staff_user_ids_to_admin_users: false
    homepage:
      gitRepoBranch: master
      gitRepoUrl: https://github.com/MAAP-Project/maap-hub-homepage
      templateVars:
        # Non-logged-in visitors go straight to EDL (oauth_login), matching the
        # MAAP Console — no sign-up landing first. New/role-less users then hit the
        # hub's 403 page, which bounces them to /signup?status=pending&from=hub
        # (the post-auth "in review" state) on the paired UAT web env.
        redirect_to: https://hub.maap-project.org/hub/oauth_login

  singleuser:
    extraEnv:
      SCRATCH_BUCKET: s3://maap-scratch-prod/$(JUPYTERHUB_USER)
      MAAP_API_HOST: api.maap-project.org
      DOCKERIMAGE_PATH_DEFAULT: mas.maap-project.org/root/maap-workspaces/custom_images/maap_base:v6.0.0
      DOCKERIMAGE_PATH_BASE_IMAGE: $(JUPYTER_IMAGE)
      WORKSPACE_BUCKET: maap-ops-workspace
    profileList:
      choose:
        profile_options:
          image:
            choices:
              01-pangeo:
                display_name: Modified Pangeo Notebook v5.2.0
                kubespawner_override:
                  image: mas.maap-project.org/root/maap-workspaces/2i2c/pangeo:v5.2.0
              02-rocker:
                display_name: Rocker Geospatial v5.2.0
                kubespawner_override:
                  image: mas.maap-project.org/root/maap-workspaces/2i2c/r:v5.2.0
              03-isce3:
                display_name: isce3 v5.2.0
                kubespawner_override:
                  image: mas.maap-project.org/root/maap-workspaces/2i2c/isce3:v5.2.0
              04-pangeo-ogc:
                display_name: OGC compliant Modified Pangeo Notebook v6.0.0
                kubespawner_override:
                  image: mas.maap-project.org/root/maap-workspaces/2i2c/pangeo:v6.0.0
              05-rocker-ogc:
                display_name: OGC compliant Rocker Geospatial v6.0.0
                kubespawner_override:
                  image: mas.maap-project.org/root/maap-workspaces/2i2c/r:v6.0.0
              06-isce3-ogc:
                display_name: OGC compliant isce3 v6.0.0
                description: Pangeo based notebook with a Python environment and isce3
                kubespawner_override:
                  image: mas.maap-project.org/root/maap-workspaces/2i2c/isce3:v6.0.0
      nvidia:
        profile_options:
          image:
            choices:
              pytorch-maap:
                kubespawner_override:
                  image: mas.maap-project.org/root/maap-workspaces/2i2c/pytorch:v5.2.0
              pytorch-maap-ogc:
                kubespawner_override:
                  image: mas.maap-project.org/root/maap-workspaces/2i2c/pytorch:v6.0.0
              tensorflow2-maap:
                kubespawner_override:
                  image: mas.maap-project.org/root/maap-workspaces/2i2c/tensorflow2:v5.2.0
              tensorflow2-maap-ogc:
                slug: tensorflow2
                kubespawner_override:
                  image: mas.maap-project.org/root/maap-workspaces/2i2c/tensorflow2:v6.0.0
  hub:
    config:
      GenericOAuthenticator:
        token_url: https://auth.openveda.cloud/realms/maap/protocol/openid-connect/token
        authorize_url: https://auth.openveda.cloud/realms/maap/protocol/openid-connect/auth
      Authenticator:
        # End the Keycloak SSO session on hub logout. Without this, logout only
        # clears the hub session; the login page's redirect_to (oauth_login)
        # then silently re-authenticates via the live Keycloak cookie and the
        # user lands back on the dashboard still logged in. Requires
        # https://www.maap-project.org/* in the jupyterhub-maap client's
        # "Valid post logout redirect URIs" in Keycloak.
        logout_redirect_url: https://auth.openveda.cloud/realms/maap/protocol/openid-connect/logout?client_id=jupyterhub-maap&post_logout_redirect_uri=https%3A%2F%2Fwww.maap-project.org%2F

dask-gateway:
  gateway:
    backend:
      imagePullSecrets: [name: image-pull-secret]

binderhub-service:
  config:
    BinderHub:
      image_prefix: quay.io/imagebuilding-non-gcp-hubs/maap-prod-
jupyterhub-home-nfs:
  eks:
    volumeId: vol-0cb9118aa95971a6a
  quotaEnforcer:
    config:
      QuotaManager:
        hard_quota: 150 # in GiB
