basehub:
  nodePlaceholder:
    enabled: true
    nodeSelector:
      node.kubernetes.io/instance-type: r5.4xlarge
    replicas: 0
  nfs:
    pv:
      serverIP: 10.100.130.27
  jupyterhub:
    hub:
      allowNamedServers: true
      config:
        JupyterHub:
          authenticator_class: shared-password
        Authenticator:
          enable_auth_state: false
          manage_groups: false
          allow_all: true
    singleuser:
      profileList:
      - display_name: Choose your environment and resources
        default: true
        profile_options:
          image:
            display_name: Environment
            dynamic_image_building:
              enabled: true
            unlisted_choice:
              enabled: true
              display_name: Custom image
              description: Specify your own docker image (must have python and jupyterhub installed in it)
              validation_regex: ^.+:.+$
              validation_message: Must be a publicly available docker image, of form <image-name>:<tag>
              kubespawner_override:
                image: '{value}'
            choices:
              01-python:
                display_name: Python
                description: Python datascience environment
                kubespawner_override:
                  image: openscapes/python:998fa91
              02-r:
                display_name: R + Python Geospatial
                description: Py-R - Geospatial + QGIS, Panoply, CWUtils - py-rocket-geospatial-2 latest
                kubespawner_override:
                  image: ghcr.io/nmfs-opensci/container-images/py-rocket-geospatial-2:latest
              03-matlab:
                display_name: Matlab
                description: Matlab environment
                kubespawner_override:
                  image: openscapes/matlab:2023-11-28
          resource_allocation:
            display_name: Resource Allocation
            choices:
              mem_2_gb:
                display_name: ~2 GB RAM, ~0.2 CPUs
                description: Up to ~15 CPUs when available
                default: true
                kubespawner_override:
                  mem_guarantee: 2000647094
                  mem_limit: 2000647094
                  cpu_guarantee: 0.2403296875
                  cpu_limit: 15.3811
                  node_selector:
                    node.kubernetes.io/instance-type: r5.4xlarge
              mem_4_gb:
                display_name: ~4 GB RAM, ~0.5 CPUs
                description: Up to ~15 CPUs when available
                kubespawner_override:
                  mem_guarantee: 4001294188
                  mem_limit: 4001294188
                  cpu_guarantee: 0.480659375
                  cpu_limit: 15.3811
                  node_selector:
                    node.kubernetes.io/instance-type: r5.4xlarge
              mem_7_gb:
                display_name: ~7 GB RAM, ~1.0 CPUs
                description: Up to ~15 CPUs when available
                kubespawner_override:
                  mem_guarantee: 8002588377
                  mem_limit: 8002588377
                  cpu_guarantee: 0.96131875
                  cpu_limit: 15.3811
                  node_selector:
                    node.kubernetes.io/instance-type: r5.4xlarge
              mem_15_gb:
                display_name: ~15 GB RAM, ~1.9 CPUs
                description: Up to ~15 CPUs when available
                kubespawner_override:
                  mem_guarantee: 16005176754
                  mem_limit: 16005176754
                  cpu_guarantee: 1.9226375
                  cpu_limit: 15.3811
                  node_selector:
                    node.kubernetes.io/instance-type: r5.4xlarge
              mem_30_gb:
                display_name: ~30 GB RAM, ~4 CPUs
                description: Up to ~15 CPUs when available
                kubespawner_override:
                  mem_guarantee: 32010353508
                  mem_limit: 32010353508
                  cpu_guarantee: 3.845275
                  cpu_limit: 15.3811
                  node_selector:
                    node.kubernetes.io/instance-type: r5.4xlarge
              mem_60_gb:
                display_name: ~60 GB RAM, ~8 CPUs
                description: Up to ~15 CPUs when available
                kubespawner_override:
                  mem_guarantee: 64020707016
                  mem_limit: 64020707016
                  cpu_guarantee: 7.69055
                  cpu_limit: 15.3811
                  node_selector:
                    node.kubernetes.io/instance-type: r5.4xlarge
              mem_119_gb:
                display_name: ~119 GB RAM, ~15 CPUs
                description: ~15 CPUs always available
                kubespawner_override:
                  mem_guarantee: 128041414033
                  mem_limit: 128041414033
                  cpu_guarantee: 15.3811
                  cpu_limit: 15.3811
                  node_selector:
                    node.kubernetes.io/instance-type: r5.4xlarge
      storage:
        extraVolumeMounts:
          1-shared-public-volumemount:
            name: home
            mountPath: /home/jovyan/shared-public
            subPath: _shared-public
            readOnly: false
      extraEnv:
        SCRATCH_BUCKET: s3://openscapeshub-scratch-workshop/$(JUPYTERHUB_USER)
        PERSISTENT_BUCKET: s3://openscapeshub-persistent-workshop/$(JUPYTERHUB_USER)

  jupyterhub-home-nfs:
    eks:
      volumeId: vol-072fbfa88f513edb7
