jupyterhub:
  scheduling:
    userScheduler:
      # I was noticing sometimes upto a minute between when
      # a new node is up and the scheduler notices with the
      # default optimizing scheduler. Let's run our own scheduler
      # which is much faster. This is anecdotal information
      enabled: true
  custom:
    2i2c:
      add_staff_user_ids_of_type: github
      add_staff_user_ids_to_admin_users: false
    homepage:
      gitRepoBranch: unify-logins-2
      templateVars:
        designed_by:
          name: 2i2c
          url: https://2i2c.org
        funded_by:
          name: CloudBank
          url: http://cloudbank.org/
        operated_by:
          name: CloudBank
          url: http://cloudbank.org/
        org:
          logo_url: https://www.cloudbank.org/sites/default/files/file_fields/logo.png
          name: CloudBank Classroom - GPU Demo
          url: https://www.cloudbank.org/
  hub:
    allowNamedServers: true
    config:
      JupyterHub:
        admin_access: true
        authenticator_class: shared-password
      Authenticator:
        manage_groups: false
        # Allow everyone with the right password to log in
        allow_all: true
        admin_users:
        - yuvipanda@2i2c.org
        - sean.smorris@berkeley.edu
        - ericvd@berkeley.edu
jupyterhub-home-nfs:
  gke:
    volumeId: projects/cb-1003-1696/zones/us-central1-b/disks/hub-nfs-homedirs-gpu-demo
  quotaEnforcer:
    config:
      QuotaManager:
        hard_quota: 30 # in GiB
