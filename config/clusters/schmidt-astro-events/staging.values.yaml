nfs:
  pv:
    serverIP: 10.100.140.233
jupyterhub:
  custom:
    litellmKeyProvisioner:
      hubName: staging.schmidt-astro-events.2i2c.cloud
      teamIds:
      - schmidt-astro-participants-staging
      keyTeamId: schmidt-astro-participants-staging
    s3files:
      mounts:
        schmidt-observatory-system:
          volumeHandle: fs-00abd9668906bc93d
  singleuser:
    jupyter_server_config.json:
      data:
        # set ping interval to 10s & timeout to 30s,
        # so we recover from congested websocket connections early
        # These are ignored until https://github.com/jupyter-server/jupyter_server/pull/1700
        # is merged and deployed, so we also set ws_ping_interval & ws_ping_timeout
        websocket_ping_interval: 10
        websocket_ping_timeout: 30
        tornado_settings:
          # These are set in ms
          ws_ping_interval: 10000
          ws_ping_timeout: 30000
    extraEnv:
      SCRATCH_BUCKET: s3://schmidt-astro-events-scratch-staging/$(JUPYTERHUB_USER)

jupyterhub-home-nfs:
  eks:
    volumeId: vol-02b012cf8d00a4f89

