prometheusStorageClass:
  gke:
    enabled: true


prometheus:
  server:
    persistentVolume:
      size: 100Gi
    ingress:
      enabled: true
      hosts:
      - prometheus.ucec.2i2c.cloud
      tls:
      - secretName: prometheus-tls
        hosts:
        - prometheus.ucec.2i2c.cloud

grafana:
  grafana.ini:
    server:
      root_url: https://grafana.ucec.2i2c.cloud/
  auth.github:
    enabled: true
    allowed_organizations: 2i2c-org
  persistence:
    # We don't need 10Gi on the Grafana persistent directory
    size: 1Gi
  ingress:
    hosts:
    - grafana.ucec.2i2c.cloud
    tls:
    - secretName: grafana-tls
      hosts:
      - grafana.ucec.2i2c.cloud

