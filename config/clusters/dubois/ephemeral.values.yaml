jupyterhub:
  hub:
    config:
      JupyterHub:
        authenticator_class: tmp
      Authenticator:
        allow_all: true
  custom:
    usageQuotas:
      enabled: false
    singleuserAdmin:
      # Turn off trying to mount shared-readwrite folder for admins
      extraVolumeMounts:
  singleuser:
    initContainers: []
    storage:
      # No persistent storage should be kept to reduce any potential data
      # retention & privacy issues.
      type: none
      extraVolumeMounts:
      extraVolumes:

jupyterhub-home-nfs:
  enabled: false
