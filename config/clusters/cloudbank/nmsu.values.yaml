jupyterhub:
  singleuser:
    image:
      name: us-central1-docker.pkg.dev/cal-icor-hubs/user-images/base-user-image
      tag: 42a579e662f4
  scheduling:
    userScheduler:
      enabled: true
  custom:
    2i2c:
      add_staff_user_ids_of_type: google
      add_staff_user_ids_to_admin_users: true
    homepage:
      templateVars:
        designed_by:
          name: 2i2c
          url: https://2i2c.org
        funded_by:
          name: CloudBank
          url: http://cloudbank.org/
        operated_by:
          name: CloudBank
          url: http://cloudbank.org/
        org:
          logo_url: https://nmsu.edu/assets/svg/logos/logo-hp-header.svg
          name: New Mexico State University
          url: https://nmsu.edu/
  hub:
    db:
      pvc:
        storageClassName: standard-rwo
    config:
      JupyterHub:
        authenticator_class: cilogon
      CILogonOAuthenticator:
        allowed_idps:
          https://sso.nmsu.edu/idp:
            default: true
            username_derivation:
              username_claim: email
            allowed_domains:
            - nmsu.edu
      Authenticator:
        admin_users:
        - sean.smorris@berkeley.edu
        - ericvd@berkeley.edu
        - talipovm@nmsu.edu
jupyterhub-home-nfs:
  gke:
    volumeId: projects/cb-1003-1696/zones/us-central1-b/disks/hub-nfs-homedirs-nmsu
  quotaEnforcer:
    config:
      QuotaManager:
        hard_quota: 10 # in GiB
