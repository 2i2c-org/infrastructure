jupyterhub:
  scheduling:
    userScheduler:
      enabled: true
  custom:
    2i2c:
      add_staff_user_ids_of_type: google
      add_staff_user_ids_to_admin_users: true
    homepage:
      templateVars:
        designed_by:
          name: 2i2c
          url: https://2i2c.org
        funded_by:
          name: CloudBank
          url: http://cloudbank.org/
        operated_by:
          name: CloudBank
          url: http://cloudbank.org/
        org:
          logo_url: https://upload.wikimedia.org/wikipedia/commons/5/5d/Miami_University_logo_2021.svg
          name: Miami University
          url: https://miamioh.edu/
  hub:
    db:
      pvc:
        storageClassName: standard-rwo
    config:
      JupyterHub:
        authenticator_class: cilogon
      CILogonOAuthenticator:
        allowed_idps:
          urn:mace:incommon:muohio.edu:
            default: true
            username_derivation:
              username_claim: email
            allowed_domains:
            - miamioh.edu
            - muohio.edu
          http://google.com/accounts/o8/id:
            username_derivation:
              username_claim: email
      Authenticator:
        admin_users:
        - sean.smorris@berkeley.edu
        - ericvd@berkeley.edu
        - zhengw22@miamioh.edu
jupyterhub-home-nfs:
  gke:
    volumeId: projects/cb-1003-1696/zones/us-central1-b/disks/hub-nfs-homedirs-miamioh
  quotaEnforcer:
    config:
      QuotaManager:
        hard_quota: 10 # in GiB
