nfs:
  enabled: true
  pv:
    enabled: true
    # from https://docs.aws.amazon.com/efs/latest/ug/mounting-fs-nfs-mount-settings.html
dask-gateway:
  enabled: true
  gateway:
    auth:
      type: jupyterhub
      jupyterhub:
        jupyterhubServiceName: dask-gateway

jupyterhub:

  prePuller:
    # Pre-pull all explicitly specified images in our profiles on all nodes
    # when they start up
    continuous:
      enabled: true

    extraImages:
      # Keep up to date with the container used for pulling in docs, under extraContainers
      nbgitpuller:
        name: public.ecr.aws/nasa-veda/jupyterhub-gitpuller-init
        tag: 97eb45f9d23b128aff810e45911857d5cffd05c2
      # Keep up to date with s3fs sidecar
      s3fs:
        name: mas.dit.maap-project.org/root/che-sidecar-s3fs
        tag: 2i2c # This is a mutable tag, so may trigger re-pulls

  custom:
    daskhubSetup:
      enabled: true
    2i2c:
      add_staff_user_ids_to_admin_users: true
      add_staff_user_ids_of_type: github
    # NOTE: homepage.templateVars is set per-hub (prod = full homepage `org` set;
    # staging = `redirect_to`). The basehub schema makes the two mutually
    # exclusive, so it cannot be shared here in common.
  hub:
    allowNamedServers: true
    loadRoles:
      server:
        scopes:
        - self
        - access:services!service=dask-gateway
        - users:activity!user
      user:
        scopes:
        - self
        - access:services!service=usage-quota
        - access:services!service=dask-gateway
        # Access to binder service
        - access:services!service=binder
    config:
      JupyterHub:
        authenticator_class: generic-oauth
      Authenticator:
        admin_users:
        - freitagb
        - wildintellect
        authenticator_class: generic-oauth
        enable_auth_state: true
        # Disable for now the authentication token refreshing
        # https://oauthenticator.readthedocs.io/en/latest/reference/api/gen/oauthenticator.oauth2.html#oauthenticator.oauth2.OAuthenticator.auth_refresh_age
        auth_refresh_age: 0
      GenericOAuthenticator:
        # We want to get user data from the JWT that's the id token,
        # not from a separate userdata API call
        userdata_from_id_token: true
        scope:
        - basic
        - profile
        - openid
        username_claim: preferred_username
        manage_groups: true
        auth_state_groups_key: oauth_user.roles
        admin_groups:
        - Admin
        # Being granted *any* jupyterhub related role should allow you
        # to login
        allowed_groups:
        - Admin
        - CPU:XS
        - CPU:S
        - CPU:M
        - CPU:L
        - CPU:XL
        - CPU:XXL
        - CPU:XXXL
        - GPU:T4
    extraConfig:
      001-username-claim: |
        def populate_token(spawner, auth_state):
          # For our deployment-service-check health check user, there is no auth_state.
          if auth_state:
            pgt = f"jwt:{auth_state.get('id_token', '')}"

            spawner.environment.update({
              "MAAP_PGT": pgt,
              "KC_ACCESS_TOKEN": auth_state.get("access_token", ""),
              "KC_ID_TOKEN": auth_state.get("id_token", ""),
              "KC_REFRESH_TOKEN": auth_state.get("refresh_token", "")
            })

            # Inject MAAP_PGT into the s3fs sidecar container
            for container in spawner.extra_containers:
              if container.get("name") == "s3fs":
                env_list = container.setdefault("env", [])
                env_list.append({
                    "name": "MAAP_PGT",
                    "value": pgt,
                })

        c.Spawner.auth_state_hook = populate_token
      # MAAP member-sync webhook maintained by the MAAP Platform team.
      # Runs via modify_auth_state_hook, which fires during authenticate()
      # BEFORE the allowed-groups check — so a member record is auto-created
      # for every authenticated user, including brand-new pending/role-less
      # users who are then rejected from the hub and redirected to the sign-up
      # page. (A post_auth_hook only runs for already-allowed users, so it can
      # never create the pending record an admin needs to review.)
      002-member-sync-webhook: |
        from tornado.httpclient import AsyncHTTPClient
        from z2jh import get_config

        async def _notify_maap_api(authenticator, base_url, pgt):
            """Call the MAAP REST API so it registers/refreshes the member."""
            http_client = AsyncHTTPClient()
            try:
                await http_client.fetch(
                    f"{base_url}/api/members/self",
                    method="GET",
                    headers={"Authorization": f"Bearer {pgt}"},
                    request_timeout=5.0,
                )
            except Exception as e:
                authenticator.log.exception("MAAP member-sync webhook failed: %s", e)

        async def maap_modify_auth_state_hook(authenticator, auth_state):
            """Notify the MAAP REST API during authentication (before the
            allowed-groups check) so pending users are auto-created."""
            base_url = get_config("custom.maap.apiBaseUrl", "")
            authenticator.log.info("MAAP member-sync webhook: base_url=%s", base_url)
            if not base_url or not auth_state:
                return auth_state

            # The access token carries the jupyterhub-maap audience the MAAP API
            # requires, and lets the API retrieve the user's EDL token from the
            # Keycloak broker endpoint.
            pgt = f"jwt:{auth_state.get('access_token', '')}"
            authenticator.log.info("MAAP member-sync webhook: calling %s/api/members/self", base_url)

            await _notify_maap_api(authenticator, base_url, pgt)

            return auth_state

        c.GenericOAuthenticator.modify_auth_state_hook = maap_modify_auth_state_hook
  singleuser:
    cloudMetadata:
      blockWithIptables: false
    defaultUrl: /lab
    storage:
      extraVolumes:
        01-s3fs-volume:
          name: s3fs-volume
          emptyDir: {}
      extraVolumeMounts:
        01-shared-public-volumemount:
          name: home
          mountPath: /home/jovyan/shared-public
          subPath: _shared-public
          readOnly: false
        02-shared-public-rstudio-volumemount:
          name: home
          mountPath: /home/rstudio/shared-public
          subPath: _shared-public
          readOnly: false
        03-s3fs-private-bucket-volumemount:
          name: s3fs-volume
          mountPath: /home/jovyan/my-private-bucket
          subPath: my-private-bucket
          mountPropagation: HostToContainer
          readOnly: false
        04-s3fs-public-bucket-volumemount:
          name: s3fs-volume
          mountPath: /home/jovyan/my-public-bucket
          subPath: my-public-bucket
          mountPropagation: HostToContainer
          readOnly: false
        05-s3fs-shared-bucket-volumemount:
          name: s3fs-volume
          mountPath: /home/jovyan/shared-buckets
          subPath: shared-buckets
          mountPropagation: HostToContainer
          readOnly: true
        06-s3fs-private-triaged-jobs-volumemount:
          name: s3fs-volume
          mountPath: /home/jovyan/triaged-jobs
          subPath: triaged-jobs
          mountPropagation: HostToContainer
          readOnly: true
        07-s3fs-org-buckets-volumemount:
          name: s3fs-volume
          mountPath: /home/jovyan/my-team-buckets
          subPath: my-team-buckets
          mountPropagation: HostToContainer
          readOnly: false
    extraContainers:
    - name: s3fs
      image: mas.dit.maap-project.org/root/che-sidecar-s3fs:2i2c
      imagePullPolicy: Always
      securityContext:
        privileged: true
      resources:
        limits:
          memory: 512Mi
          cpu: 1.0
        requests:
          # If we don't set requests, k8s sets requests == limits!
          # So we set something tiny
          memory: 64Mi
          cpu: 0.01
      volumeMounts:
      - name: s3fs-volume
        mountPath: /my-public-bucket
        subPath: my-public-bucket
        mountPropagation: Bidirectional
      - name: s3fs-volume
        mountPath: /my-private-bucket
        subPath: my-private-bucket
        mountPropagation: Bidirectional
      - name: s3fs-volume
        mountPath: /shared-buckets
        subPath: shared-buckets
        mountPropagation: Bidirectional
      - name: s3fs-volume
        mountPath: /triaged-jobs
        subPath: triaged-jobs
        mountPropagation: Bidirectional
      - name: s3fs-volume
        mountPath: /my-team-buckets
        subPath: my-team-buckets
        mountPropagation: Bidirectional
    # Running gitpuller as a regular container rather than an init container
    # so that neither its image pull nor the repo pull blocks the notebook
    # container from starting.
    - name: jupyterhub-gitpuller-init
      # Keep this up to date with `prePuller.extraImages`
      image: public.ecr.aws/nasa-veda/jupyterhub-gitpuller-init:97eb45f9d23b128aff810e45911857d5cffd05c2
      # The image's CMD clones and then exits 0, which is correct for an init
      # container but not here. We're adding `sleep infinity` to run indefinitely
      command:
      - /bin/bash
      - -c
      - |
        bash /opt/k8s-init-gitpuller.sh
        exec sleep infinity
      resources:
        limits:
          memory: 256Mi
          cpu: 0.5
        requests:
          # set some tiny requests
          memory: 32Mi
          cpu: 0.01
      env:
      - name: TARGET_PATH
        value: veda-docs
      - name: SOURCE_REPO
        value: https://github.com/NASA-IMPACT/veda-docs
      volumeMounts:
      - name: home
        mountPath: /home/jovyan
        subPath: '{escaped_username}'
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000

  scheduling:
    userScheduler:
      enabled: true

binderhub-service:
  enabled: true
  networkPolicy:
    enabled: true
  # Explicitly specify what nodes we want for our builds
  # Otherwise we may scale up a larger node than needed
  config:
    DockerRegistry:
      url: &url https://quay.io
      username: &username imagebuilding-non-gcp-hubs+image_builder
    BinderHub:
      auth_enabled: true
  buildPodsRegistryCredentials:
    server: *url
    username: *username
