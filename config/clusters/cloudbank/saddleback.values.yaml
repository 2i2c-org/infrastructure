jupyterhub:
  singleuser:
    memory:
      # Increased to help deal with possible kernel restarts
      # https://2i2c.freshdesk.com/a/tickets/567
      guarantee: 384M
      limit: 1.5G
  custom:
    2i2c:
      add_staff_user_ids_of_type: google
      add_staff_user_ids_to_admin_users: true
    homepage:
      templateVars:
        designed_by:
          name: 2i2c
          url: https://2i2c.org
        funded_by:
          name: CloudBank
          url: http://cloudbank.org/
        operated_by:
          name: CloudBank
          url: http://cloudbank.org/
        org:
          logo_url: https://www.saddleback.edu/sites/default/files/site-wrapper/logo/saddleback_logo.svg
          name: Saddleback College
          url: https://www.saddleback.edu/
  hub:
    image:
      name: quay.io/2i2c/oauthenticator-latest
      tag: 0.0.1-0.dev.git.16666.h2707c010b
    config:
      JupyterHub:
        authenticator_class: google
      GoogleOAuthenticator:
        username_claim: email
        allowed_hosted_domains:
        - saddleback.edu
        - ivc.edu
        strip_domain: false
        # allowed_hosted_domains is additive and honours admin_users,
        # so allow_all is not needed. allow_existing_users grandfathers
        # the off-domain accounts already in this hub's database.
        allow_all: false
        allow_existing_users: true
      Authenticator:
        admin_users:
        - ericvd@berkeley.edu
        - sean.smorris@berkeley.edu
        - afoote@saddleback.edu
jupyterhub-home-nfs:
  gke:
    volumeId: projects/cb-1003-1696/zones/us-central1-b/disks/hub-nfs-homedirs-saddleback
