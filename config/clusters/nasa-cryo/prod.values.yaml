basehub:
  nfs:
    pv:
      serverIP: 10.100.102.109
  jupyterhub:
    singleuser:
      extraEnv:
        SCRATCH_BUCKET: s3://nasa-cryo-scratch/$(JUPYTERHUB_USER)
        PANGEO_SCRATCH: s3://nasa-cryo-scratch/$(JUPYTERHUB_USER)
        PERSISTENT_BUCKET: s3://nasa-cryo-persistent/$(JUPYTERHUB_USER)
      extraFiles:
        opencode:
          mountPath: /etc/opencode-default/opencode.json
          data:
            $schema: "https://opencode.ai/config.json"
            model: nrp/kimi
            disabled_providers:
              - opencode
            provider:
              nrp:
                npm: "@ai-sdk/openai-compatible"
                name: NRP
                options:
                  baseURL: "https://ellm.nrp-nautilus.io/v1"
                  apiKey: "{env:OPENAI_API_KEY}"
                models:
                  kimi:
                    name: kimi
                    limit:
                      "context": 262144
                      "output": 32768
                    options:
                      chat_template_kwargs:
                        "thinking": true
                        "preserve_thinking": true
                    variants:
                      instruct:
                        chat_template_kwargs:
                          thinking: false
                          preserve_thinking: false
                  qwen3:
                    name: qwen3
                  qwen3-small:
                    name: qwen3-small
                  gpt-oss:
                    name: gpt-oss
                  gemma:
                    name: gemma
                  gemma-small:
                    name: gemma-small
                  glm-5:
                    name: glm-5
                  minimax-m2:
                    name: minimax-m2
  jupyterhub-home-nfs:
    eks:
      volumeId: vol-00b9cf4a258bce8ef
    quotaEnforcer:
      config:
        QuotaManager:
          hard_quota: 35 # in GiB
  binderhub-service:
    config:
      BinderHub:
        image_prefix: quay.io/imagebuilding-non-gcp-hubs/nasa-cryo-prod-
    extraEnv:
    - name: JUPYTERHUB_API_URL
      value: http://hub.prod.svc.cluster.local:8081/hub/api
