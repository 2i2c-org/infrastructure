jupyterhub:
  singleuser:
    defaultUrl: /lab
    memory:
      guarantee: 384M
      limit: 1.5G
    # TEMPORARY: pin ahead of common.values.yaml to try the base-user-image
    # build that adds the xeus-cling C++ kernel (cal-icor/base-user-image#165).
    # Once we've confirmed it works here, pull this back out and let UTA pick
    # up the tag from common.values.yaml again.
    image:
      name: us-central1-docker.pkg.dev/cal-icor-hubs/user-images/base-user-image
      tag: c70771325780
  custom:
    2i2c:
      add_staff_user_ids_of_type: google
      add_staff_user_ids_to_admin_users: true
    homepage:
      templateVars:
        designed_by:
          name: 2i2c
          url: https://2i2c.org
        funded_by:
          name: CloudBank
          url: http://cloudbank.org/
        operated_by:
          name: CloudBank
          url: http://cloudbank.org/
        org:
          logo_url: https://upload.wikimedia.org/wikipedia/commons/2/2b/University_of_Texas_at_Arlington_logo.svg
          name: University of Texas at Arlington
          url: https://www.uta.edu/
  hub:
    config:
      JupyterHub:
        authenticator_class: cilogon
      CILogonOAuthenticator:
        allowed_idps:
          https://idp.uta.edu/idp/shibboleth:
            default: true
            allow_all: true
            username_derivation:
              username_claim: email
          http://google.com/accounts/o8/id:
            username_derivation:
              username_claim: email
      Authenticator:
        admin_users:
        - sean.smorris@berkeley.edu
        - ericvd@berkeley.edu
        - cearto@uta.edu
jupyterhub-home-nfs:
  gke:
    volumeId: projects/cb-1003-1696/zones/us-central1-b/disks/hub-nfs-homedirs-uta
  quotaEnforcer:
    config:
      QuotaManager:
        hard_quota: 10 # in GiB
