jupyterhub:
  prePuller:
    continuous:
      enabled: true
    pullProfileListImages: true
    extraTolerations:
    - key: hub.jupyter.org/dedicated
      operator: Exists
      effect: NoSchedule
    - key: nvidia.com/gpu
      operator: Equal
      value: present
      effect: NoSchedule
  singleuser:
    nodeSelector:
      node.kubernetes.io/instance-type: n1-highmem-8
    profileList:
    - display_name: CPU only
      default: true
      kubespawner_override:
        image: us-central1-docker.pkg.dev/cal-icor-hubs/user-images/base-user-image:e42c967c281c
        mem_guarantee: 512M
        mem_limit: 1G
        cpu_guarantee: 0.1
        cpu_limit: 2
    - display_name: GPU (NVIDIA T4)
      description: Shared T4 GPU, ~1.5 CPU guaranteed (up to 3 when available)
      kubespawner_override:
        image: us-central1-docker.pkg.dev/cal-icor-hubs/user-images/workshop-gpu-image:b663a88f6217
        environment:
          NVIDIA_DRIVER_CAPABILITIES: compute,utility
        mem_guarantee: 12G
        mem_limit: 16G
        cpu_guarantee: 1.5
        cpu_limit: 3
        node_selector:
          node.kubernetes.io/instance-type: n1-highmem-8
        extra_resource_limits:
          nvidia.com/gpu: '1'
