jupyterhub:
  singleuser:
    defaultUrl: /lab
  custom:
    2i2c:
      add_staff_user_ids_of_type: google
      add_staff_user_ids_to_admin_users: true
    homepage:
      templateVars:
        designed_by:
          name: 2i2c
          url: https://2i2c.org
        funded_by:
          name: CloudBank
          url: http://cloudbank.org/
        operated_by:
          name: CloudBank
          url: http://cloudbank.org/
        org:
          logo_url: https://www.mtu.edu/_resources/images/sitewide/michigan-tech-logo-full-black.svg
          name: Michigan Technological University
          url: https://www.mtu.edu/
  hub:
    db:
      pvc:
        storageClassName: standard-rwo
    config:
      JupyterHub:
        authenticator_class: google
      GoogleOAuthenticator:
        username_claim: email
        allowed_hosted_domains:
        - mtu.edu
        strip_domain: false
        allow_all: false
      Authenticator:
        admin_users:
        - sean.smorris@berkeley.edu
        - ericvd@berkeley.edu
        - kalkhama@mtu.edu
jupyterhub-home-nfs:
  gke:
    volumeId: projects/cb-1003-1696/zones/us-central1-b/disks/hub-nfs-homedirs-mtu
  quotaEnforcer:
    config:
      QuotaManager:
        hard_quota: 10 # in GiB
