jupyterhub:
  singleuser:
    defaultUrl: /lab
    memory:
      guarantee: 512M
      limit: 1G
  custom:
    2i2c:
      add_staff_user_ids_of_type: google
      add_staff_user_ids_to_admin_users: true
    homepage:
      templateVars:
        designed_by:
          name: 2i2c
          url: https://2i2c.org
        funded_by:
          name: CloudBank
          url: http://cloudbank.org/
        operated_by:
          name: CloudBank
          url: http://cloudbank.org/
        org:
          logo_url: https://cdn.ncsu.edu/brand-assets/logos/ncstate-brick-2x1-red.png
          name: North Carolina State University
          url: https://www.ncsu.edu/
  hub:
    image:
      name: quay.io/2i2c/oauthenticator-latest
      tag: 0.0.1-0.dev.git.17203.h34102b8b4
    config:
      JupyterHub:
        authenticator_class: google
      GoogleOAuthenticator:
        username_claim: email
        allowed_hosted_domains:
        - ncsu.edu
        strip_domain: false
        allow_all: false
      Authenticator:
        admin_users:
        - sean.smorris@berkeley.edu
        - ericvd@berkeley.edu
        - blhurwit@ncsu.edu
    db:
      pvc:
        storageClassName: standard-rwo
jupyterhub-home-nfs:
  gke:
    volumeId: projects/cb-1003-1696/zones/us-central1-b/disks/hub-nfs-homedirs-ncsu
  quotaEnforcer:
    config:
      QuotaManager:
        hard_quota: 10 # in GiB
