jupyterhub:
  singleuser:
    image:
      name: quay.io/2i2c/utoronto-r-image
      tag: 72a29e4eeb0f

  ingress:
    hosts: [r-staging.datatools.utoronto.ca]
    tls:
    - hosts: [r-staging.datatools.utoronto.ca]
      secretName: https-auto-tls

  hub:
    config:
      GenericOAuthenticator:
        allow_all: true
    db:
      pvc:
        # prod stores logs, so let's make it big
        storage: 10Gi
