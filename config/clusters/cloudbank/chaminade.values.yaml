jupyterhub:
  singleuser:
    defaultUrl: /lab
  custom:
    2i2c:
      add_staff_user_ids_of_type: google
      add_staff_user_ids_to_admin_users: true
    homepage:
      templateVars:
        designed_by:
          name: 2i2c
          url: https://2i2c.org
        funded_by:
          name: CloudBank
          url: http://cloudbank.org/
        operated_by:
          name: CloudBank
          url: http://cloudbank.org/
        org:
          logo_url: https://ucm.sfo3.digitaloceanspaces.com/wp-content/uploads/2018/08/08074025/Chaminade-Logo-Centered.jpg
          name: Chaminade University of Honolulu
          url: https://chaminade.edu/
  hub:
    db:
      pvc:
        # Default SC 'standard' is Immediate-binding, so it provisions the
        # disk before scheduling and can land outside us-central1-b, where
        # core-pool lives -- leaving the hub pod permanently unschedulable.
        # standard-rwo is WaitForFirstConsumer, so the disk follows the pod.
        storageClassName: standard-rwo
    config:
      JupyterHub:
        authenticator_class: cilogon
      CILogonOAuthenticator:
        allowed_idps:
          http://google.com/accounts/o8/id:
            default: true
            username_derivation:
              username_claim: email
            allowed_domains:
            - chaminade.edu
            - student.chaminade.edu
      Authenticator:
        admin_users:
        - sean.smorris@berkeley.edu
        - ericvd@berkeley.edu
        - victoria.delacruz@chaminade.edu
jupyterhub-home-nfs:
  gke:
    volumeId: projects/cb-1003-1696/zones/us-central1-b/disks/hub-nfs-homedirs-chaminade
  quotaEnforcer:
    config:
      QuotaManager:
        hard_quota: 10 # in GiB
