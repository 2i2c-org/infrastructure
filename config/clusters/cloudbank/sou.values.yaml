jupyterhub:
  scheduling:
    userScheduler:
      enabled: true
  custom:
    2i2c:
      add_staff_user_ids_of_type: google
      add_staff_user_ids_to_admin_users: true
    homepage:
      templateVars:
        designed_by:
          name: 2i2c
          url: https://2i2c.org
        funded_by:
          name: CloudBank
          url: http://cloudbank.org/
        operated_by:
          name: CloudBank
          url: http://cloudbank.org/
        org:
          logo_url: https://sou.edu/wp-content/uploads/2016/06/Southern-Oregon-University.png
          name: Southern University Oregon
          url: https://sou.edu/
  hub:
    image:
      name: quay.io/2i2c/oauthenticator-latest
      tag: 0.0.1-0.dev.git.16666.h2707c010b
    config:
      JupyterHub:
        authenticator_class: google
      GoogleOAuthenticator:
        username_claim: email
        allowed_hosted_domains:
        - sou.edu
        strip_domain: false
        allow_all: true
      Authenticator:
        admin_users:
        - ericvd@berkeley.edu
        - sean.smorris@berkeley.edu
        - boscoeb@sou.edu

jupyterhub-home-nfs:
  quotaEnforcer:
    config:
      QuotaManager:
        hard_quota: 10 # in GiB
  gke:
    volumeId: projects/cb-1003-1696/zones/us-central1-b/disks/hub-nfs-homedirs-sou
