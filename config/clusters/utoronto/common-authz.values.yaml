jupyterhub:
  hub:
    image:
      name: quay.io/2i2c/pilot-hub-authz-helpers
      tag: 0.0.1-0.dev.git.17043.h6d9b98223
    extraConfig:
      001-canvas-auth: |
        from jupyterhub_oauthenticator_authz_helpers.canvas import get_course_groups, build_auth_urls
        canvas_url = "https://utoronto.instructure.com"

        async def auth_state_hook(authenticator, auth_state):
          if auth_state is None:
            return None

          access_token = auth_state["access_token"]

          groups = {
            *await get_course_groups(canvas_url, access_token, canvas_course_key="course_code")
          }

          # Only register recognised groups
          auth_state[authenticator.auth_state_groups_key] = groups & (authenticator.allowed_groups | authenticator.admin_groups)

          auth_groups = auth_state[authenticator.auth_state_groups_key]
          print(f"Raw groups: {groups}")
          print(f"Stored groups: {auth_groups}")

          return auth_state

        cfg = c.GenericOAuthenticator
        cfg.modify_auth_state_hook = auth_state_hook

        cfg.authorize_url, cfg.token_url, cfg.userdata_url = build_auth_urls(canvas_url)

        # Scopes that this token will need
        cfg.scope = [*build_auth_urls.scopes, *get_course_groups.scopes]
    config:
      GenericOAuthenticator:
        allow_all: false
        admin_users: []
        admin_groups:
        - course::2i2c-jupyter-test::role::TeacherEnrollment
        - course::2i2c-jupyter-test::section::Another&20Section
        allowed_groups:
        - course::2i2c-jupyter-test
        manage_groups: true
        auth_state_groups_key: canvas-groups
